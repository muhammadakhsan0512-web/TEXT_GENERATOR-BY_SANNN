<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sann Text Generator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f3;
  color: #222;
}

header {
  background: linear-gradient(135deg, #087443, #13a66b);
  color: white;
  padding: 22px 16px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 25px;
}

header p {
  margin: 7px 0 0;
  opacity: .9;
}

nav {
  display: flex;
  gap: 8px;
  padding: 10px;
  background: white;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 2px 8px #0001;
}

nav button {
  flex: 1;
  border: 0;
  padding: 12px 5px;
  border-radius: 10px;
  background: #e8f5ef;
  color: #087443;
  font-weight: bold;
  cursor: pointer;
}

nav button.active {
  background: #087443;
  color: white;
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 18px;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 15px;
  margin-bottom: 15px;
  box-shadow: 0 3px 12px #00000012;
}

label {
  display: block;
  font-weight: bold;
  margin: 12px 0 6px;
}

input,
select,
textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 15px;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

.main-btn {
  width: 100%;
  border: 0;
  padding: 13px;
  margin-top: 15px;
  border-radius: 10px;
  background: #087443;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.main-btn:hover {
  opacity: .9;
}

.copy-btn {
  background: #13a66b;
}

.danger-btn {
  background: #d9534f;
}

.info {
  background: #e9f8f1;
  padding: 12px;
  border-radius: 10px;
  color: #087443;
  margin-top: 10px;
  font-size: 14px;
}

.text-item {
  background: #f7f7f7;
  border: 1px solid #ddd;
  padding: 10px;
  margin-bottom: 7px;
  border-radius: 8px;
  white-space: pre-wrap;
}

#copyResult {
  max-height: 450px;
  overflow-y: auto;
  margin-top: 15px;
}

#pdfPreview {
  background: white;
  padding: 25px;
  margin-top: 15px;
}

.pdf-page {
  page-break-after: always;
}

.pdf-page:last-child {
  page-break-after: auto;
}

.pdf-title {
  text-align: center;
  font-size: 22px;
  margin-bottom: 20px;
}

.pdf-item {
  margin-bottom: 9px;
  line-height: 1.5;
}

.hidden {
  display: none;
}

footer {
  text-align: center;
  padding: 25px;
  color: #777;
  font-size: 13px;
}

/* =========================
   KHUSUS SAAT CETAK / PDF
   ========================= */
@media print {

  @page {
    size: A4;
    margin: 15mm;
  }

  /* SEMUA MENU DAN KONTROL WEBSITE DISEMBUNYIKAN */
  header,
  nav,
  footer,
  button,
  input,
  select,
  textarea,
  label,
  .info,
  .card:not(#pdfDocument),
  .no-print {
    display: none !important;
  }

  body {
    background: white !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  .container {
    max-width: none !important;
    padding: 0 !important;
    margin: 0 !important;
  }

  #pdfDocument {
    display: block !important;
    box-shadow: none !important;
    padding: 0 !important;
    margin: 0 !important;
  }

  #pdfPreview {
    display: block !important;
    margin: 0 !important;
    padding: 0 !important;
  }
}
</style>
</head>

<body>

<header>
  <h1>📝 Sann Text Generator</h1>
  <p>Buat teks hingga 10.000 dokumen</p>
</header>

<nav>
  <button id="menuText" class="active" onclick="showMenu('text')">
    📝 Salin Teks
  </button>

  <button id="menuPdf" onclick="showMenu('pdf')">
    📄 Dokumen PDF
  </button>
</nav>

<div class="container">

  <!-- MENU SALIN TEKS -->
  <section id="textMenu">

    <div class="card">
      <h2>📝 Generator Teks</h2>

      <label>Teks</label>
      <textarea id="textInput"
        placeholder="Contoh: Maaf ya kak, saya tidak sengaja..."></textarea>

      <label>Jumlah teks</label>
      <select id="textQuantity">
        <option value="1">1</option>
        <option value="10">10</option>
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="200">200</option>
        <option value="500">500</option>
        <option value="1000">1.000</option>
      </select>

      <button class="main-btn" onclick="generateText()">
        Buat Teks
      </button>

      <div id="copyResult"></div>
    </div>

  </section>


  <!-- MENU PDF -->
  <section id="pdfMenu" class="hidden">

    <div class="card no-print">
      <h2>📄 Buat Dokumen PDF</h2>

      <div class="info">
        Maksimal 10.000 teks. Hasil PDF hanya akan berisi isi dokumen,
        tanpa menu website.
      </div>

      <label>Teks awal</label>
      <textarea id="pdfText"
        placeholder="Contoh: Ini adalah teks pertama..."></textarea>

      <label>Jumlah teks</label>
      <select id="pdfQuantity">
        <option value="1000">1.000</option>
        <option value="2000">2.000</option>
        <option value="3000">3.000</option>
        <option value="5000">5.000</option>
        <option value="7500">7.500</option>
        <option value="10000">10.000</option>
      </select>

      <label>Judul dokumen</label>
      <input id="pdfTitle" value="Dokumen Sann">

      <label>Teks per halaman</label>
      <select id="perPage">
        <option value="30">30 teks</option>
        <option value="50">50 teks</option>
        <option value="75">75 teks</option>
        <option value="100">100 teks</option>
      </select>

      <button class="main-btn" onclick="createPDF()">
        📄 Buat Dokumen
      </button>

      <button class="main-btn copy-btn" onclick="printPDF()">
        💾 Simpan sebagai PDF
      </button>

      <button class="main-btn" onclick="sharePDF()">
        📤 Bagikan PDF
      </button>

      <button class="main-btn danger-btn" onclick="clearPDF()">
        🗑️ Hapus Dokumen
      </button>
    </div>


    <!-- BAGIAN YANG AKAN DICETAK -->
    <div id="pdfDocument" class="card hidden">

      <div id="pdfPreview"></div>

    </div>

  </section>

</div>

<footer class="no-print">
  by sann
</footer>


<script>

function showMenu(menu) {

  const textMenu = document.getElementById("textMenu");
  const pdfMenu = document.getElementById("pdfMenu");

  const menuText = document.getElementById("menuText");
  const menuPdf = document.getElementById("menuPdf");

  if (menu === "text") {

    textMenu.classList.remove("hidden");
    pdfMenu.classList.add("hidden");

    menuText.classList.add("active");
    menuPdf.classList.remove("active");

  } else {

    textMenu.classList.add("hidden");
    pdfMenu.classList.remove("hidden");

    menuText.classList.remove("active");
    menuPdf.classList.add("active");
  }
}


/* =========================
   GENERATOR TEKS
   ========================= */

function generateText() {

  const text = document.getElementById("textInput").value.trim();
  const quantity = Number(
    document.getElementById("textQuantity").value
  );

  const result = document.getElementById("copyResult");

  if (!text) {
    alert("Masukkan teks terlebih dahulu.");
    return;
  }

  result.innerHTML = "";

  for (let i = 1; i <= quantity; i++) {

    const div = document.createElement("div");

    div.className = "text-item";

    div.innerHTML =
      "<b>" + i + ".</b> " +
      escapeHTML(text);

    result.appendChild(div);
  }

  const copyButton = document.createElement("button");

  copyButton.className = "main-btn copy-btn";
  copyButton.textContent = "📋 Salin Semua";

  copyButton.onclick = function() {

    let allText = "";

    for (let i = 1; i <= quantity; i++) {
      allText += i + ". " + text + "\n";
    }

    navigator.clipboard.writeText(allText);

    alert("Semua teks berhasil disalin!");
  };

  result.prepend(copyButton);
}


/* =========================
   BUAT DOKUMEN PDF
   ========================= */

function createPDF() {

  const text = document.getElementById("pdfText").value.trim();
  const quantity = Number(
    document.getElementById("pdfQuantity").value
  );

  const title =
    document.getElementById("pdfTitle").value.trim()
    || "Dokumen Sann";

  const perPage = Number(
    document.getElementById("perPage").value
  );

  if (!text) {
    alert("Masukkan teks terlebih dahulu.");
    return;
  }

  const pdfDocument =
    document.getElementById("pdfDocument");

  const preview =
    document.getElementById("pdfPreview");

  preview.innerHTML = "";

  const totalPages =
    Math.ceil(quantity / perPage);

  for (let page = 0; page < totalPages; page++) {

    const pageDiv = document.createElement("div");

    pageDiv.className = "pdf-page";

    if (page === 0) {

      const titleDiv =
        document.createElement("div");

      titleDiv.className = "pdf-title";

      titleDiv.textContent = title;

      pageDiv.appendChild(titleDiv);
    }

    const start =
      page * perPage + 1;

    const end =
      Math.min(
        (page + 1) * perPage,
        quantity
      );

    for (let i = start; i <= end; i++) {

      const item =
        document.createElement("div");

      item.className = "pdf-item";

      item.innerHTML =
        "<b>" + i + ".</b> " +
        escapeHTML(text);

      pageDiv.appendChild(item);
    }

    preview.appendChild(pageDiv);
  }

  pdfDocument.classList.remove("hidden");

  alert(
    "Dokumen berhasil dibuat!\n\n" +
    "Jumlah: " + quantity.toLocaleString("id-ID") +
    "\nHalaman: " + totalPages.toLocaleString("id-ID")
  );

  pdfDocument.scrollIntoView({
    behavior: "smooth"
  });
}


/* =========================
   SIMPAN PDF
   ========================= */

function printPDF() {

  const preview =
    document.getElementById("pdfPreview");

  if (!preview.innerHTML.trim()) {
    alert("Buat dokumen terlebih dahulu.");
    return;
  }

  window.print();
}


/* =========================
   BAGIKAN PDF
   ========================= */

async function sharePDF() {

  const preview =
    document.getElementById("pdfPreview");

  if (!preview.innerHTML.trim()) {
    alert("Buat dokumen terlebih dahulu.");
    return;
  }

  alert(
    "Pilih 'Simpan sebagai PDF' terlebih dahulu.\n" +
    "Setelah file tersimpan, kamu bisa membagikannya melalui WhatsApp, Telegram, Drive, dan lainnya."
  );

  window.print();
}


/* =========================
   HAPUS DOKUMEN
   ========================= */

function clearPDF() {

  document.getElementById("pdfPreview").innerHTML = "";

  document
    .getElementById("pdfDocument")
    .classList.add("hidden");
}


/* =========================
   KEAMANAN HTML
   ========================= */

function escapeHTML(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

</script>

</body>
</html>
